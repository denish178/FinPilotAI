services:
  mongodb:
    image: mongo:7
    container_name: finpilot-mongodb
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./server
    container_name: finpilot-api
    restart: unless-stopped
    env_file:
      - ./server/.env.docker
    environment:
      MONGODB_URI: mongodb://mongodb:27017/finpilot
      CLIENT_URL: http://localhost:8080
      NODE_ENV: production
    ports:
      - "5000:5000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mongodb:
        condition: service_healthy

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: /api
    container_name: finpilot-client
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  mongo_data:
  uploads_data:
